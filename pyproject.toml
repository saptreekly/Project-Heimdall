[project]
name = "heimdall"
version = "0.1.0"
description = "Map ragebait narratives and coordinated amplification across social platforms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "redis>=5.2.0",
    "praw>=7.8.0",
    "networkx>=3.4.0",
    "neo4j>=5.26.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
hf = [
    "datasets>=3.0.0",
]
# Sentence embeddings for theme clustering (CI uses this; local may fall back to TF-IDF).
ml = [
    "sentence-transformers>=3.0.0",
]
# Optional: transformer sentiment (install with pip install -e ".[ml,ml-hf]")
ml-hf = [
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "spacy>=3.8.0",
    "datasets>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heimdall"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
