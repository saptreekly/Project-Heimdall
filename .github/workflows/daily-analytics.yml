# Daily coordination watchlist + sentiment alerts + GitHub issues on tier crossings.
name: daily-analytics

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-analytics
  cancel-in-progress: false

jobs:
  watchlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Heimdall
        run: pip install -e .

      - name: Verify snapshot
        run: python scripts/verify_snapshot.py

      - name: Update coordination watchlist
        run: |
          python scripts/coordination_watchlist.py \
            --write \
            --crossings-out /tmp/coordination_crossings.json

      - name: Update sentiment watchlist
        run: |
          python scripts/sentiment_watchlist.py \
            --write \
            --crossings-out /tmp/sentiment_crossings.json

      - name: Commit watchlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard/WATCHLIST.md data/dashboard/watchlist_state.json
          git add data/dashboard/SENTIMENT_WATCHLIST.md data/dashboard/sentiment_watchlist_state.json
          if git diff --staged --quiet; then
            echo "Watchlists unchanged."
          else
            git commit -m "chore: daily coordination and sentiment watchlist update [skip ci]"
            git push
          fi

      - name: Open issues for coordination tier crossings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create coordination-alert --color FF8800 --description "Text coordination tier crossing" 2>/dev/null || true
          if [ ! -s /tmp/coordination_crossings.json ] || [ "$(cat /tmp/coordination_crossings.json)" = "[]" ]; then
            echo "No coordination tier crossings — skipping issues."
          else
            python <<'PY'
          import json
          import os
          import subprocess

          crossings = json.loads(open("/tmp/coordination_crossings.json").read())
          for row in crossings:
              title = (
                  f"Coordination alert: {row['narrative']} "
                  f"{row['previous_tier']} → {row['new_tier']} "
                  f"(text {row['score']:.2f})"
              )
              signals = row.get("signals") or []
              body = (
                  f"Automated watchlist crossing detected.\n\n"
                  f"- Narrative: **{row['narrative']}**\n"
                  f"- Previous tier: `{row['previous_tier']}`\n"
                  f"- New tier: **{row['new_tier']}**\n"
                  f"- Text coordination: `{row['score']:.2f}`\n"
                  f"- Combined suspicion: `{row.get('combined', 'n/a')}`\n\n"
                  f"Signals:\n"
                  + "\n".join(f"- {s}" for s in signals)
                  + "\n\nSee `data/dashboard/WATCHLIST.md` for history."
              )
              subprocess.run(
                  [
                      "gh", "issue", "create",
                      "--title", title,
                      "--body", body,
                      "--label", "coordination-alert",
                  ],
                  check=False,
                  env={**os.environ},
              )
          PY
          fi

      - name: Open issues for sentiment alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create sentiment-alert --color C0392B --description "Sentiment trend or WoW alert" 2>/dev/null || true
          if [ ! -s /tmp/sentiment_crossings.json ] || [ "$(cat /tmp/sentiment_crossings.json)" = "[]" ]; then
            echo "No sentiment alerts — skipping issues."
            exit 0
          fi
          python <<'PY'
          import json
          import os
          import subprocess

          alerts = json.loads(open("/tmp/sentiment_crossings.json").read())
          for row in alerts:
              title = f"Sentiment alert: {row['narrative']} — {row['kind'].replace('_', ' ')}"
              body = (
                  f"Automated sentiment watchlist alert.\n\n"
                  f"- Narrative: **{row['narrative']}**\n"
                  f"- Kind: `{row['kind']}`\n"
                  f"- Trend: `{row.get('trend', 'n/a')}`\n"
                  f"- Detail: {row.get('detail', '')}\n\n"
                  f"See `data/dashboard/SENTIMENT_WATCHLIST.md` for history."
              )
              subprocess.run(
                  [
                      "gh", "issue", "create",
                      "--title", title,
                      "--body", body,
                      "--label", "sentiment-alert",
                  ],
                  check=False,
                  env={**os.environ},
              )
          PY
