# Build analysis data + dashboard, deploy to GitHub Pages.
# One-time: Settings → Pages → Source must be "GitHub Actions" (Not Found until enabled).
#
# Data sources (first match wins):
#   1. Committed data/dashboard/heimdall.db (copy local DB here and push)
#   2. Secret DASHBOARD_DATABASE_URL (remote Postgres/SQLite URL)
#   3. Fail export if DB empty (no mock seed)

name: pages

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_run:
    workflows: [ingest]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "web/**"
      - "heimdall/**"
      - "scripts/**"
      - "data/scheduled_ingest.json"
      - ".github/workflows/maintenance.yml"
      - ".github/workflows/daily-analytics.yml"
      - "data/astroturf.tsv"
      - ".github/workflows/pages.yml"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Share the data-writer lock so metrics commits don't race ingest/maintenance.
  group: heimdall-repo-data
  cancel-in-progress: false

env:
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface
  SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.cache/huggingface
  USE_EMBEDDING_THEMES: "true"
  USE_NEURAL_EMBEDDINGS: "false"
  RESCORE_USE_EMBEDDINGS: "false"
  RESCORE_BEFORE_EXPORT: "true"
  USE_TRANSFORMER_SENTIMENT: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore ML and pip caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: ${{ runner.os }}-heimdall-ml-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-heimdall-ml-

      - name: Install Heimdall (ML extras for theme clustering)
        run: pip install -e ".[ml]"

      - name: Warm sentence-transformers model (populate cache)
        if: env.USE_NEURAL_EMBEDDINGS == 'true'
        run: |
          python -c "
          from sentence_transformers import SentenceTransformer
          SentenceTransformer('all-MiniLM-L6-v2')
          print('Embedding model ready')
          "

      - name: Configure database
        run: |
          if [ -f data/dashboard/heimdall.db ]; then
            echo "DATABASE_URL=sqlite+aiosqlite:///./data/dashboard/heimdall.db" >> "$GITHUB_ENV"
            echo "Using committed data/dashboard/heimdall.db"
          elif [ -n "${{ secrets.DASHBOARD_DATABASE_URL }}" ]; then
            echo "DATABASE_URL=${{ secrets.DASHBOARD_DATABASE_URL }}" >> "$GITHUB_ENV"
            echo "Using DASHBOARD_DATABASE_URL secret"
          else
            echo "DATABASE_URL=sqlite+aiosqlite:///./data/dashboard/ci-build.db" >> "$GITHUB_ENV"
            echo "No committed DB; export will fail unless DASHBOARD_DATABASE_URL is set"
          fi

      - name: Seed database if empty
        run: python scripts/seed_dashboard_if_empty.py
        continue-on-error: true

      - name: Export dashboard snapshot
        run: python scripts/export_dashboard_data.py

      - name: Verify snapshot
        env:
          SNAPSHOT_SENTIMENT_STRICT: "true"
        run: python scripts/verify_snapshot.py

      - name: Snapshot metrics artifact + history
        run: |
          python scripts/snapshot_report.py --format json --write-json /tmp/snapshot-metrics.json --append-history

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-metrics
          path: /tmp/snapshot-metrics.json
          retention-days: 90

      - name: Commit metrics history
        run: |
          bash scripts/ci_git_push.sh \
            --message "chore: append daily snapshot metrics [skip ci]" \
            -- \
              data/dashboard/metrics_history.jsonl

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        working-directory: web
        env:
          VITE_BASE: /Project-Heimdall/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Deployment summary
        run: |
          echo "### Pages deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          python scripts/snapshot_report.py --format markdown >> "$GITHUB_STEP_SUMMARY" || true
