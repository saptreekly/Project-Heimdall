# Scheduled ingest → commit data/dashboard/heimdall.db + snapshot → Pages redeploys via workflow_run.
# Requires GitHub secrets: AUTH_TOKEN and CT0 (or X_AUTH_TOKEN / X_CT0).
# X schedule: 30 runs / 24h → one GraphQL search every 48 minutes (24*60/30).
#
# Note: The Actions UI text "workflow_dispatch event trigger" only describes the manual Run button.
# Cron schedules still run automatically when this workflow is enabled (not disabled in Actions list).

name: ingest

on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"
    - cron: "48 0,4,8,12,16,20 * * *"
    - cron: "36 1,5,9,13,17,21 * * *"
    - cron: "24 2,6,10,14,18,22 * * *"
    - cron: "12 3,7,11,15,19,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-data
  cancel-in-progress: false

env:
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface
  SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore ML and pip caches
        uses: actions/cache@v4
        id: ml-cache
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: ${{ runner.os }}-heimdall-ml-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-heimdall-ml-

      - name: Install Heimdall (ML extras for theme clustering)
        run: pip install -e ".[ml]"

      - name: Warm sentence-transformers model (populate cache)
        run: |
          python -c "
          from sentence_transformers import SentenceTransformer
          SentenceTransformer('all-MiniLM-L6-v2')
          print('Embedding model ready in', __import__('os').environ.get('HF_HOME'))
          "

      - name: Prepare dashboard database
        run: |
          mkdir -p data/dashboard
          if [ ! -f data/dashboard/heimdall.db ]; then
            echo "No committed DB yet; starting empty SQLite file"
          fi

      - name: Run scheduled ingest (X guardrails enforced)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/dashboard/heimdall.db
          X_RATE_STATE_PATH: data/dashboard/x_rate_state.json
          X_ROTATION_STATE_PATH: data/dashboard/x_keyword_rotation.json
          X_SCHEDULED_KEYWORDS_PER_RUN: "1"
          USE_EMBEDDING_THEMES: "true"
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CT0: ${{ secrets.CT0 }}
          X_INGEST_ENABLED: "true"
        run: python scripts/scheduled_ingest.py

      - name: Verify dashboard snapshot
        run: python scripts/verify_snapshot.py

      - name: Commit ingest data to repo
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard/heimdall.db data/dashboard/x_rate_state.json data/dashboard/x_keyword_rotation.json web/public/data/snapshot.json
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
          else
            git commit -m "chore: scheduled ingest data and dashboard snapshot"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ingest summary
        run: |
          echo "### Ingest run" >> "$GITHUB_STEP_SUMMARY"
          echo "- ML cache hit: ${{ steps.ml-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Committed data: ${{ steps.commit.outputs.committed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages deploy will start via workflow_run when ingest completes." >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    runs-on: ubuntu-latest
    needs: ingest
    if: failure()
    steps:
      - name: Ingest failed
        run: |
          echo "::error::Ingest workflow failed — check logs, X secrets, and daily GraphQL budget."
          echo "Enable the workflow under Actions if scheduled runs never appear (event: schedule)."
