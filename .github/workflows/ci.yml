# Pull request and push quality gates — Python tests, lint, web build, snapshot smoke.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Heimdall (ML + dev)
        run: pip install -e ".[ml,dev]"

      - name: Ruff lint
        run: ruff check heimdall tests scripts

      - name: Pytest
        run: pytest -q

      - name: Mypy (new modules)
        run: mypy heimdall/api/deps.py heimdall/graph/author_signals.py heimdall/logging_config.py

  web:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint and test dashboard
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run test

      - name: Build dashboard (GitHub Pages base path)
        working-directory: web
        env:
          VITE_BASE: /Project-Heimdall/
        run: npm run build

  snapshot:
    name: Snapshot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Heimdall
        run: pip install -e ".[ml]"

      - name: Verify committed snapshot
        run: python scripts/verify_snapshot.py

      - name: Snapshot report
        run: python scripts/snapshot_report.py --format github-summary

  export-regression:
    name: Export pipeline regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore ML caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: ${{ runner.os }}-heimdall-ml-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-heimdall-ml-

      - name: Install Heimdall (ML)
        run: pip install -e ".[ml]"

      - name: Warm embedding model
        if: hashFiles('data/dashboard/heimdall.db') != '' && env.USE_NEURAL_EMBEDDINGS == 'true'
        run: |
          python -c "
          from sentence_transformers import SentenceTransformer
          SentenceTransformer('all-MiniLM-L6-v2')
          "

      - name: Re-export from committed DB (if present)
        if: hashFiles('data/dashboard/heimdall.db') != ''
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/dashboard/heimdall.db
          USE_EMBEDDING_THEMES: "true"
          USE_NEURAL_EMBEDDINGS: "false"
          RESCORE_USE_EMBEDDINGS: "false"
          RESCORE_BEFORE_EXPORT: "true"
          USE_TRANSFORMER_SENTIMENT: "false"
        run: |
          python scripts/export_dashboard_data.py -o /tmp/snapshot-export.json
          SNAPSHOT_SENTIMENT_STRICT=true python scripts/verify_snapshot.py -s /tmp/snapshot-export.json
          python -c "
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/snapshot-export.json').read_text())
          assert data.get('version', 0) >= 5, data.get('version')
          assert data.get('narratives'), 'no narratives'
          nid = str(data['narratives'][0]['id'])
          bundle = data['by_narrative_id'][nid]
          assert 'provenance' in bundle
          assert 'text_coordination_score' in bundle['cib']
          sentiment = bundle['sentiment']
          assert 'divergence_days' in sentiment
          assert 'week_over_week' in sentiment
          posts = bundle.get('posts') or []
          if posts:
              assert 'escalation_tier' in posts[0]
              assert 'polarity' in posts[0]
          print('Export regression OK:', data.get('version'), len(data['narratives']), 'narratives')
          "
