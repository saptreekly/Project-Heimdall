# Manual re-export of snapshot.json from the committed dashboard DB (no ingest).
name: export-dashboard

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit updated snapshot.json to main
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: heimdall-repo-data
  cancel-in-progress: false

env:
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface
  SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.cache/huggingface
  USE_EMBEDDING_THEMES: "true"
  USE_NEURAL_EMBEDDINGS: "false"
  RESCORE_USE_EMBEDDINGS: "false"
  RESCORE_BEFORE_EXPORT: "true"
  USE_TRANSFORMER_SENTIMENT: "false"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore ML caches
        uses: actions/cache@v6
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: ${{ runner.os }}-heimdall-ml-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-heimdall-ml-

      - name: Install Heimdall (ML)
        run: pip install -e ".[ml]"

      - name: Warm embedding model
        if: env.USE_NEURAL_EMBEDDINGS == 'true'
        run: |
          python -c "
          from sentence_transformers import SentenceTransformer
          SentenceTransformer('all-MiniLM-L6-v2')
          "

      - name: Require committed database
        run: |
          if [ ! -f data/dashboard/heimdall.db ]; then
            echo "::error::Missing data/dashboard/heimdall.db — run ingest or publish locally first."
            exit 1
          fi

      - name: Export dashboard snapshot
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/dashboard/heimdall.db
        run: python scripts/export_dashboard_data.py

      - name: Verify snapshot (strict sentiment schema)
        env:
          SNAPSHOT_SENTIMENT_STRICT: "true"
        run: python scripts/verify_snapshot.py

      - name: Snapshot report
        run: python scripts/snapshot_report.py --format github-summary

      - name: Commit snapshot
        if: inputs.commit
        run: |
          bash scripts/ci_git_push.sh \
            --message "chore: re-export dashboard snapshot [export workflow]" \
            -- \
              web/public/data/snapshot.json \
              data/dashboard/briefs \
              web/public/data/briefs
