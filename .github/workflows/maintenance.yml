# Weekly DB maintenance, theme drift, keyword audit.
name: maintenance

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintenance
  cancel-in-progress: false

env:
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface
  SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.cache/huggingface
  USE_EMBEDDING_THEMES: "true"
  RESCORE_BEFORE_EXPORT: "true"
  USE_TRANSFORMER_SENTIMENT: "false"
  DATABASE_URL: sqlite+aiosqlite:///./data/dashboard/heimdall.db

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Heimdall (ML)
        run: pip install -e ".[ml]"

      - name: Require dashboard database
        run: |
          if [ ! -f data/dashboard/heimdall.db ]; then
            echo "::error::Missing data/dashboard/heimdall.db"
            exit 1
          fi

      - name: Rescore narratives (lexicon v2.3 + embed themes)
        run: python scripts/rescore_dashboard_narratives.py --if-stale

      - name: Database maintenance
        run: python scripts/maintain_dashboard_db.py --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Theme drift report
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          python scripts/theme_drift_report.py \
            --narrative midterms_2026 \
            --output "reports/theme-drift-${STAMP}.md" \
            --update-baseline

      - name: Keyword audit + gap discovery
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          python scripts/keyword_audit.py \
            --narrative midterms_2026 \
            --days 7 \
            --output "reports/keyword-audit-${STAMP}.md"

      - name: Rotate stale keywords
        run: |
          python scripts/rotate_keywords.py \
            --narrative midterms_2026 \
            --days 7 \
            --apply >> "$GITHUB_STEP_SUMMARY"

      - name: Re-export snapshot after maintenance
        run: python scripts/export_dashboard_data.py

      - name: TweetEval lexicon benchmark (offline sample)
        continue-on-error: true
        run: |
          pip install -e ".[hf]" -q
          python scripts/benchmark_outrage.py --subset hate --subset offensive --limit 50

      - name: Commit maintenance outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard/heimdall.db data/dashboard/theme_baseline.json data/dashboard/keyword_suggestions.json data/dashboard/x_keyword_rotation.json data/scheduled_ingest.json web/public/data/snapshot.json reports/
          for f in data/dashboard/keyword_rotation_log.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No maintenance changes to commit."
          else
            git commit -m "chore: weekly maintenance, theme drift, keyword audit"
            git push
          fi
