services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: heimdall
      POSTGRES_DB: heimdall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/heimdallgraph
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://heimdall:heimdall@postgres:5432/heimdall
      NEO4J_URI: bolt://neo4j:7687
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - postgres
      - neo4j
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
  neo4jdata:
